name: Release

# Builds signed macOS + unsigned Linux artifacts and publishes them to this
# repo's GitHub Releases, which is also what /product/desktop on afreemail-web
# and electron-updater both read from.
#
# Windows isn't built here yet -- there's no code-signing certificate, and an
# unsigned .exe triggers a "Windows protected your PC" SmartScreen warning
# severe enough that handing it out unsigned would do more harm than good
# (see README's "Not yet done" section). Add a windows job here, matching the
# mac job's CSC_LINK/CSC_KEY_PASSWORD pattern but with a real Authenticode
# cert, once that exists.
#
# Both platform jobs also build afreemail-web from its own repo and bundle the
# result into src/web-dist/ before electron-builder packages the app -- this is
# what lets the shell open with no internet connection at all (see main.js's
# WEB_DIST_DIR/afreemail:// protocol handling and README.md). That checkout
# needs a token with read access to afreemail-web -- the default GITHUB_TOKEN
# only has access to the repo the workflow itself runs in, so this uses a
# separate fine-grained PAT secret (README.md's secrets table).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/checkout@v4
        with:
          repository: Emplug/afreemail-web
          path: afreemail-web-src
          token: ${{ secrets.AFREEMAIL_WEB_CHECKOUT_TOKEN }}

      - name: Build afreemail-web and bundle it into the desktop app
        # npm ci here (not just this repo's own npm install below) hits the same
        # class of lockfile-drift failure as the comment on npm install below
        # describes: afreemail-web's package-lock.json isn't in exact sync with its
        # package.json (a transitive picomatch version mismatch, confirmed via a
        # real CI run) -- npm install reconciles instead of hard-failing, same
        # tradeoff already accepted for this repo's own install.
        run: |
          npm install --prefix afreemail-web-src
          npm run build --prefix afreemail-web-src
          rm -rf src/web-dist
          mkdir -p src/web-dist
          cp -r afreemail-web-src/dist/. src/web-dist/
        env:
          VITE_HARAKA_API_URL: https://mail.afreemail.com

      # electron-builder's app-builder-lib declares platform-specific packaging
      # tools (electron-builder-squirrel-windows, etc.) as required
      # peerDependencies rather than optional ones. Whether npm auto-installs
      # those onto the lockfile is inconsistent across npm versions/platforms
      # (confirmed: passes locally on x64, fails as "missing from lock file"
      # on the arm64 macos-latest runner) -- npm ci's strict lockfile
      # validation trips on that drift even though nothing is actually wrong.
      # `npm install` reconciles instead of hard-failing, which is fine for a
      # release build that isn't trying to be byte-for-byte reproducible.
      - run: npm install

      - run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/checkout@v4
        with:
          repository: Emplug/afreemail-web
          path: afreemail-web-src
          token: ${{ secrets.AFREEMAIL_WEB_CHECKOUT_TOKEN }}

      - name: Build afreemail-web and bundle it into the desktop app
        # npm install, not npm ci -- afreemail-web's package-lock.json isn't in
        # exact sync with its package.json (a transitive picomatch version
        # mismatch, confirmed via a real CI run: `npm ci` refuses to install at
        # all when that happens). Same tradeoff the mac job's own npm install
        # below already accepts for this repo's own lockfile drift.
        run: |
          npm install --prefix afreemail-web-src
          npm run build --prefix afreemail-web-src
          rm -rf src/web-dist
          mkdir -p src/web-dist
          cp -r afreemail-web-src/dist/. src/web-dist/
        env:
          VITE_HARAKA_API_URL: https://mail.afreemail.com

      - run: npm install

      # AppImage needs no signing/notarization step -- there's no Linux-side
      # equivalent gatekeeper to satisfy.
      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder always leaves an existing release in draft state when it
  # updates one (confirmed: this happens regardless of the package.json
  # `publish.releaseType` config, which only affects brand-new releases) --
  # intentional on their end so a release isn't visible while other platform
  # jobs are still uploading to it. With two platform jobs now uploading to
  # the same tag, un-drafting has to wait until BOTH finish, not happen inside
  # either platform job the way the mac-only version of this workflow did --
  # otherwise whichever job finishes first would publish the release before
  # the other platform's assets exist.
  publish:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github.ref_name is only a version tag (matching electron-builder's own
      # v<version> release naming) when this run was triggered by a tag push --
      # for a workflow_dispatch run (README documents this as an equally valid
      # way to release, not just tag push) it's the branch name instead, e.g.
      # "main", which isn't a release and made this fail with "release not
      # found" the first time this ran that way. package.json's version is what
      # electron-builder itself actually used to name the release, so read it
      # from there instead of assuming anything about how this run started.
      - name: Un-draft the release electron-builder just updated
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v$version" --draft=false --repo Emplug/afreemail-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
