name: Release (macOS)

# Builds a signed, notarized macOS app and publishes it to this repo's GitHub
# Releases, which is also what /product/desktop on afreemail-web and
# electron-updater both read from. Windows/Linux are built separately (see
# README) until those signing credentials exist.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder's app-builder-lib declares platform-specific packaging
      # tools (electron-builder-squirrel-windows, etc.) as required
      # peerDependencies rather than optional ones. Whether npm auto-installs
      # those onto the lockfile is inconsistent across npm versions/platforms
      # (confirmed: passes locally on x64, fails as "missing from lock file"
      # on the arm64 macos-latest runner) -- npm ci's strict lockfile
      # validation trips on that drift even though nothing is actually wrong.
      # `npm install` reconciles instead of hard-failing, which is fine for a
      # release build that isn't trying to be byte-for-byte reproducible.
      - run: npm install

      - run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder always leaves an existing release in draft state when
      # it updates one (confirmed: this happens regardless of the `releaseType`
      # config, which only affects brand-new releases) -- intentional on their
      # end so a release isn't visible while other platform jobs are still
      # uploading to it. We're mac-only for now, so just publish immediately
      # after this job's own upload finishes.
      - run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
